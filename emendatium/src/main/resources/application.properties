# ── App ──
spring.application.name=musarum-enricher
spring.config.import=optional:file:../.env[.properties]

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=7d

# Jackson
spring.jackson.deserialization.fail-on-unknown-properties=false

# ── Servidor ──
server.port=8081

# ── Actuator ──
management.endpoints.web.exposure.include=health,info,metrics
management.metrics.tags.application=musarum-emendatium

# ── Enricher: rutas ──
enricher.folders.input=C:/Users/carlo/Documents/Musica
enricher.folders.batch-output=C:/Users/carlo/Documents/Musica/_enrichment

# ── Enricher: binarios externos ──
enricher.binaries.ffmpeg=C:/ffmpeg/bin/ffmpeg.exe
enricher.binaries.fpcalc=C:/fpcalc/fpcalc.exe

# ── Enricher: HTTP ──
enricher.http.user-agent=MusarumEnricher/1.0 ( https://carlossanchezmiranda.com )
enricher.http.timeout-seconds=20

# ── Enricher: fuentes (claves desde .env) ──
enricher.sources.acoustid.api-key=${ACOUSTID_API_KEY:}
enricher.sources.discogs.token=${DISCOGS_TOKEN:}
enricher.sources.lastfm.api-key=${LASTFM_API_KEY:}
enricher.sources.theaudiodb.api-key=${THEAUDIODB_API_KEY:2}

# ── MusicBrainz: rate limit + concurrencia ──
# API público: 1 req/s, 1 concurrente. Con servidor propio o cuenta
# autenticada se pueden subir ambos sin problemas.
enricher.sources.musicbrainz.api-token=${MUSICBRAINZ_TOKEN:}
enricher.sources.musicbrainz.requests-per-second=1.0
enricher.sources.musicbrainz.max-concurrent=1
# Región preferida (ISO 3166-1). Prioriza ediciones de ese país cuando hay varias.
enricher.sources.musicbrainz.preferred-country=ES

# ── Enricher: análisis local ──
enricher.analysis.sample-rate=22050
enricher.analysis.bpm-min=40
enricher.analysis.bpm-max=220

# ── Enricher: naming ──
enricher.naming.file-template={artist} - {title}
enricher.naming.max-file-length=200

# ── Enricher: anti-cover ──
# true = acepta el match aunque el artista no cuadre (solo avisa)
enricher.anti-cover.lenient=false

# ── Logging ──
spring.output.ansi.enabled=NEVER
logging.level.org.jaudiotagger=OFF
logging.level.root=INFO
logging.pattern.console=%m%n