name: Emendatium image

# Igual que backend-release pero para el otro Spring Boot. Dispara con
# tag "emendatium-vX.Y.Z" o manualmente — paths filter evita rebuilds
# cuando solo tocaste código del backend o del mobile.

on:
  push:
    tags:
      - 'emendatium-v*'
    paths:
      - 'emendatium/**'
      - '.github/workflows/emendatium-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./emendatium
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/musarum-emendatium:latest
            ghcr.io/${{ github.repository_owner }}/musarum-emendatium:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
