name: Android release

# Dispara al empujar un tag "android-vX.Y.Z". El tag queda como versionName,
# así cuadra con el /version del backend y el UpdateChecker del móvil.
#
# Secrets requeridos en el repo (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64     — el .jks codificado en base64
#   ANDROID_KEYSTORE_PASSWORD   — contraseña del store
#   ANDROID_KEY_ALIAS           — alias dentro del store (p. ej. "musarum")
#   ANDROID_KEY_PASSWORD        — contraseña de la clave (suele ser la misma)
#   MUSARUM_BASE_URL (opcional) — URL del backend que irá embebida en el APK
#                                 (http://tailscale-host:8080/api/v1/).

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (ej. 1.0.3) — usada como versionName del APK"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        # setup-gradle@v5: evita el "forced to Node 24" que el runner nuevo
        # imprime con v4 (GitHub va deprecando Node 20). Importante: le
        # decimos `build-root-directory: mobile` para que encuentre
        # `mobile/gradle/wrapper/gradle-wrapper.properties` y pre-descargue
        # Gradle 9.3.1 en el cache. Sin esto, `./gradlew` lo busca él
        # cuando estamos ya dentro del build y chocaba contra la red lenta
        # del runner (504 / timeout en services.gradle.org).
        uses: gradle/actions/setup-gradle@v5
        with:
          build-root-directory: mobile

      - name: Make gradlew executable
        # El repo se cloneó desde Windows, el bit +x se pierde. En Linux
        # ./gradlew da exit 126 (permission denied) sin este chmod.
        run: chmod +x gradlew

      - name: Pre-fetch Gradle distribution (con reintentos)
        # Red-safety-net: si setup-gradle no cacheó por lo que sea, damos
        # 5 tiros al `./gradlew --version` antes de atacar el build real,
        # para que un 504 puntual de services.gradle.org / github.com no
        # mate el workflow. Cada intento tiene 120 s (networkTimeout del
        # wrapper); entre reintentos esperamos 20 s.
        run: |
          for i in 1 2 3 4 5; do
            if ./gradlew --version; then
              echo "Gradle listo en el intento $i."
              exit 0
            fi
            echo "::warning::Intento $i fallido descargando Gradle. Reintento en 20s..."
            sleep 20
          done
          echo "::error::No se pudo descargar Gradle tras 5 intentos."
          exit 1

      - name: Validate release secrets
        # Si falta alguno de los 4 secrets Android, abortamos con mensaje
        # claro en vez de dejar que el fallo caiga más adelante con un error
        # críptico (base64 vacío, keystore ilegible, etc).
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$KEYSTORE_B64" ] && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "$KEYSTORE_PASSWORD" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ] && missing+=("ANDROID_KEY_ALIAS")
          [ -z "$KEY_PASSWORD" ] && missing+=("ANDROID_KEY_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Faltan secrets en Settings → Secrets and variables → Actions: ${missing[*]}"
            exit 1
          fi
          echo "Los 4 secrets Android están presentes."

      - name: Determine version
        id: version
        run: |
          # Si veníamos de un tag "android-v1.2.3" el version sale "1.2.3".
          # Si es manual (workflow_dispatch), lo cogemos del input.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#android-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Compilando APK versión $VERSION"

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ls -la "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          MUSARUM_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          MUSARUM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MUSARUM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MUSARUM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MUSARUM_BASE_URL: ${{ secrets.MUSARUM_BASE_URL }}
          # Inyectamos versionName vía -P y lo recoge build.gradle.kts si
          # lo wire-amos (ver nota más abajo); por ahora lo mantenemos
          # editado en el pom del móvil al crear el tag.
          MUSARUM_VERSION_NAME: ${{ steps.version.outputs.version }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "$RUNNER_TEMP/musarum-${{ steps.version.outputs.version }}.apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: musarum-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/musarum-${{ steps.version.outputs.version }}.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Musarum ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ runner.temp }}/musarum-${{ steps.version.outputs.version }}.apk
