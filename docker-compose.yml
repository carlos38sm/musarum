# Musarum — stack completo. Levanta con `docker compose up -d`.
#
# Volúmenes clave:
#   - ${MUSARUM_MUSIC_PATH}:/music → carpeta paraguas con la música y las
#     subcarpetas que el backend crea (_covers, _lyrics, _videos,
#     _profilepictures). Dentro del contenedor siempre es /music, así que
#     las variables de app apuntan a esa ruta.
#   - musarum_postgres_data → datos de Postgres (no borrar manualmente).
#
# Variables obligatorias en .env (al lado de este fichero):
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
#   JWT_SECRET, JWT_EXPIRATION
#   MUSARUM_OWNER_NICK, MUSARUM_OWNER_PASSWORD
#   MUSARUM_MUSIC_PATH (ruta HOST, no del contenedor)
#
# Opcionales:
#   MUSARUM_APK_LATEST, MUSARUM_APK_URL, MUSARUM_APK_MANDATORY → canal
#     de releases que lee el móvil al arrancar (ver VersionController).
#
# Si Emendatium no te interesa de momento, comenta su bloque + el
# EMENDATIUM_BASE_URL del backend; el backend sigue funcionando igual.

services:
  postgres:
    image: postgres:17
    container_name: musarum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - musarum_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: ghcr.io/${GITHUB_OWNER:-carlos}/musarum-backend:latest
    container_name: musarum-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dentro del contenedor Postgres está en el nombre del servicio.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # El JDBC URL del backend está hard-coded a localhost:5432 en
      # application.properties: lo sobreescribimos aquí.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      MUSARUM_OWNER_NICK: ${MUSARUM_OWNER_NICK}
      MUSARUM_OWNER_PASSWORD: ${MUSARUM_OWNER_PASSWORD}
      MUSARUM_MUSIC_PATH: /music
      # Override de JVM: el Dockerfile ya pone valores razonables, pero
      # aquí lo repetimos para que un servidor con mucha RAM pueda subirlo
      # sin reconstruir imagen. Ajusta Xmx según RAM libre del host.
      JAVA_TOOL_OPTIONS: ${BACKEND_JVM_OPTS:--Xms256m -Xmx1536m -XX:+UseG1GC}
      # Enriquecimiento opcional: si no quieres levantar Emendatium, comenta.
      EMENDATIUM_BASE_URL: http://emendatium:8081
      # Canal de releases que lee el móvil (opcional).
      MUSARUM_APK_LATEST: ${MUSARUM_APK_LATEST:-}
      MUSARUM_APK_URL: ${MUSARUM_APK_URL:-}
      MUSARUM_APK_MANDATORY: ${MUSARUM_APK_MANDATORY:-false}
      # Actualizaciones automáticas (botón "Buscar actualizaciones" en Perfil).
      # GITHUB_REPO = "owner/repo" sin https. Si está vacío, el botón del
      # móvil responderá que no hay repo configurado.
      MUSARUM_GITHUB_REPO: ${GITHUB_OWNER:-carlos38sm}/musarum
      MUSARUM_APK_URL_PATTERN: ${MUSARUM_APK_URL_PATTERN:-https://github.com/${GITHUB_OWNER:-carlos38sm}/musarum/releases/download/android-v{v}/musarum-{v}.apk}
      # Token para disparar Watchtower vía HTTP API desde el backend.
      MUSARUM_WATCHTOWER_URL: http://watchtower:8080
      MUSARUM_WATCHTOWER_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:-}
    volumes:
      - ${MUSARUM_MUSIC_PATH}:/music
    ports:
      - "8080:8080"
    labels:
      # Watchtower mira estas labels: solo actualiza las imágenes etiquetadas.
      com.centurylinklabs.watchtower.enable: "true"

  emendatium:
    build:
      context: ./emendatium
    image: ghcr.io/${GITHUB_OWNER:-carlos}/musarum-emendatium:latest
    container_name: musarum-emendatium
    restart: unless-stopped
    environment:
      MUSARUM_MUSIC_PATH: /music
      # Rutas de los binarios dentro del contenedor (sobrescriben el default
      # Windows de application.properties). La imagen ya los instala, pero
      # los dejamos explícitos para que un cambio en la base no los mueva.
      ENRICHER_BINARIES_FFMPEG: /usr/bin/ffmpeg
      ENRICHER_BINARIES_FPCALC: /usr/bin/fpcalc
      # Claves de las fuentes de enriquecimiento (opcionales salvo AcoustID,
      # que es GRATIS en https://acoustid.org/api-key y necesario para
      # identificar canciones por huella → BPM/key/MBID/replaygain).
      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
      DISCOGS_TOKEN: ${DISCOGS_TOKEN:-}
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      MUSICBRAINZ_TOKEN: ${MUSICBRAINZ_TOKEN:-}
    volumes:
      - ${MUSARUM_MUSIC_PATH}:/music
    ports:
      - "8081:8081"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Caddy TLS — SOLO para el día que se abandone Tailscale y haya que exponer
  # el backend a una red menos privada. Levanta con:
  #   docker compose --profile tls up -d
  # Mientras tanto queda apagado (profiles) y no consume recursos.
  caddy:
    image: caddy:2-alpine
    container_name: musarum-caddy
    restart: unless-stopped
    profiles: [tls]
    depends_on:
      - backend
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ── Observabilidad (Prometheus + Grafana) ──────────────────────────────
  # Perfil 'obs' para arrancarlos solo cuando interese:
  #   docker compose --profile obs up -d
  # El backend expone /actuator/prometheus en limpio dentro de la red Docker;
  # Prometheus lo scrapea cada 30 s y Grafana lo pinta. La UI de Grafana vive
  # en http://<host>:3000 (admin / admin la primera vez, te pide cambiarla).
  # Desde el móvil, el OWNER tiene un botón "Abrir Grafana" en Análisis del
  # servidor (bloque 51) que apunta a este URL vía Tailscale.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: musarum-prometheus
    restart: unless-stopped
    profiles: [obs]
    depends_on:
      - backend
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: musarum-grafana
    restart: unless-stopped
    profiles: [obs]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3000:3000"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    # containrrr/watchtower quedó abandonado tras 1.7.1 (ene 2024) y su cliente
    # Docker interno habla API v1.25 — demasiado viejo para Docker Desktop
    # moderno (exige mínimo 1.40). Usamos el fork mantenido nickfedor/watchtower,
    # que es drop-in compatible y actualiza el cliente Docker.
    image: nickfedor/watchtower:latest
    container_name: musarum-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Comprueba cada 30 min, solo actualiza contenedores con la label.
      WATCHTOWER_POLL_INTERVAL: 1800
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      # HTTP API para disparar updates al instante desde el botón
      # "Buscar actualizaciones" del móvil. El puerto 8080 queda dentro
      # de la red Docker — NO se mapea al host, así nadie fuera lo ve.
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:-}
      TZ: Europe/Madrid

volumes:
  musarum_postgres_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
