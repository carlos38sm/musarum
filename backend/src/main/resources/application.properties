# CORE -----------------------------------------------------------------------
spring.application.name=backend
server.port=8080

# DATABASE -------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# HIBERNATE ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SWAGGER --------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.use-management-port=false
springdoc.override-with-generic-response=false
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.info.title=API de Musarum
springdoc.info.description=API REST para la gestion integral de Musarum
springdoc.info.version=1.0.0
springdoc.info.contact.name=${SWAGGER_NAME}
springdoc.info.contact.email=${SWAGGER_EMAIL}

# LOG ------------------------------------------------------------------------
logging.level.com.musarum=INFO
logging.level.org.apache.catalina=WARN
logging.level.org.apache.coyote=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.boot.StartupInfoLogger=INFO
logging.level.org.hibernate=ERROR
logging.level.org.springframework.orm.jpa=ERROR
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.springframework.security=ERROR
logging.pattern.console=%clr(%d{HH:mm:ss}){yellow} %clr(%4p) %clr([%15.15t]){blue} %clr(%-25.25logger{0}){cyan} : %m%n