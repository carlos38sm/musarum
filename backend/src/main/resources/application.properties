# CORE -----------------------------------------------------------------------
spring.config.import=optional:file:../.env[.properties]
spring.application.name=backend
server.port=8080
server.servlet.context-path=/api/v1
spring.devtools.remote.restart.enabled=false

# MULTIPART UPLOAD -----------------------------------------------------------
# Suficiente para FLAC y M4A sin perder sueño; un fichero de audio normal
# anda por 5-25 MB. El OWNER sube desde el móvil con /admin/songs/upload;
# si alguna vez queremos permitir álbumes enteros en un multipart,
# subir max-request-size.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=180MB
spring.servlet.multipart.file-size-threshold=4MB

# HTTP COMPRESSION -----------------------------------------------------------
# gzip en respuestas JSON del catálogo. SongsScreen descarga ~2 MB en
# /songs?page=... con la lista completa; comprimido baja a ~400 KB. El
# móvil (OkHttp) añade Accept-Encoding: gzip solo, así que Tomcat
# decide comprimir mirando ese header. min-response-size=1024 evita
# gastar CPU comprimiendo respuestas chicas (status, version, etc.).
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# HTTP/2 ---------------------------------------------------------------------
# Tomcat sirve HTTP/1.1 por defecto. El Home del móvil dispara 7 llamadas
# paralelas: en HTTP/1.1 se abren 7 conexiones TLS separadas → saludos
# TLS + slow-start de TCP por cada una. Con HTTP/2 se multiplexan sobre
# UNA conexión, los frames comparten slow-start, y la latencia del primer
# render del Home baja ~150-250ms en LAN Tailscale. Tomcat lo negocia solo
# con ALPN cuando h2 está disponible — downgrade automático a 1.1 para
# clientes antiguos (no es nuestro caso, OkHttp 5.x habla h2).
# NOTA: HTTP/2 sin TLS (h2c) exige que el cliente lo pida explícitamente;
# OkHttp del móvil lo usa cuando Tomcat lo anuncia en cleartext, así que
# vale para Tailscale (no hay TLS entre nosotros).
server.http2.enabled=true

# DATABASE -------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# Hikari pool tuning (auditoría nov-24): size 10 cubre 4 users + 2-3
# tareas internas (scanner, poller, enriquecimiento) sin saturar
# Postgres (max_connections=100 por defecto, reservamos margen).
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# Cache de PreparedStatements del driver Postgres. Sin esto cada
# query recompila el plan en la DB — con el volumen de nuestras
# home/songs/taste-profile se nota un 15-20% en latencia agregada.
# 250 statements × 2048 chars máx = suficiente para todas las queries
# derivadas + nativas que usamos.
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
# Server-side prepared statements kick in tras 5 ejecuciones de la
# misma query → Postgres cachea el plan y evita parse+plan por call.
spring.datasource.hikari.data-source-properties.prepareThreshold=5

# HIBERNATE ------------------------------------------------------------------
# El esquema lo gestiona Flyway (ver src/main/resources/db/migration).
# Hibernate solo VALIDA que las entidades casan con lo que hay en la DB;
# si una entidad no cuadra con el esquema, el arranque falla y toca
# escribir una nueva V<n>__.sql. Nunca modifica el esquema por su cuenta.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# FLYWAY ---------------------------------------------------------------------
# baseline-on-migrate hace que una DB ya poblada SIN flyway_schema_history
# arranque con una baseline (version=1) en vez de intentar aplicar la V1.
# En Musarum instanciado hoy la fila BASELINE ya está insertada a mano.
# En instalaciones nuevas, Flyway encontrará la DB vacía y aplicará V1.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# ACTUATOR / MÉTRICAS --------------------------------------------------------
# Exponemos SOLO prometheus + health. El resto queda off para no filtrar
# detalles del runtime (configprops, env, loggers) a usuarios autenticados.
# Prometheus (compose --profile obs) scrapea /api/v1/actuator/prometheus.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.access=unrestricted
management.endpoint.health.access=unrestricted
management.endpoint.prometheus.cache.time-to-live=10s
# Tag común para poder filtrar en Grafana cuando algún día haya varios hosts.
management.metrics.tags.application=musarum-backend

# APK VERSION ----------------------------------------------------------------
# Datos que devuelve GET /version para que el móvil pida actualizar. Edita
# cuando publiques una APK nueva en GitHub Releases — el backend NO se
# recompila, basta con reiniciar el proceso.
musarum.apk.latest=${MUSARUM_APK_LATEST:}
musarum.apk.url=${MUSARUM_APK_URL:}
musarum.apk.mandatory=${MUSARUM_APK_MANDATORY:false}

# SWAGGER --------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.use-management-port=false
springdoc.override-with-generic-response=false
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# LOG ------------------------------------------------------------------------
# Credenciales de usuario por defecto de Spring Security: no las ponemos.
# Convivían con nuestro login JWT y solo generaban ruido (y un backdoor).
spring.jpa.open-in-view=false
logging.level.com.musarum=INFO
logging.level.org.apache.catalina=WARN
logging.level.org.apache.coyote=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.boot.StartupInfoLogger=INFO
logging.level.org.hibernate=ERROR
logging.level.org.springframework.orm.jpa=ERROR
logging.level.org.flywaydb=WARN
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.springframework.security=ERROR
logging.pattern.console=%clr(%d{HH:mm:ss}){yellow} %clr(%4p) %clr([%15.15t]){blue} %clr(%-25.25logger{0}){cyan} : %m%n

