# CORE -----------------------------------------------------------------------
spring.config.import=optional:file:../.env[.properties]
spring.application.name=backend
server.port=8080
server.servlet.context-path=/api/v1
spring.devtools.remote.restart.enabled=false

# DATABASE -------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# HIBERNATE ------------------------------------------------------------------
# El esquema lo gestiona Flyway (ver src/main/resources/db/migration).
# Hibernate solo VALIDA que las entidades casan con lo que hay en la DB;
# si una entidad no cuadra con el esquema, el arranque falla y toca
# escribir una nueva V<n>__.sql. Nunca modifica el esquema por su cuenta.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# FLYWAY ---------------------------------------------------------------------
# baseline-on-migrate hace que una DB ya poblada SIN flyway_schema_history
# arranque con una baseline (version=1) en vez de intentar aplicar la V1.
# En Musarum instanciado hoy la fila BASELINE ya está insertada a mano.
# En instalaciones nuevas, Flyway encontrará la DB vacía y aplicará V1.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# APK VERSION ----------------------------------------------------------------
# Datos que devuelve GET /version para que el móvil pida actualizar. Edita
# cuando publiques una APK nueva en GitHub Releases — el backend NO se
# recompila, basta con reiniciar el proceso.
musarum.apk.latest=${MUSARUM_APK_LATEST:}
musarum.apk.url=${MUSARUM_APK_URL:}
musarum.apk.mandatory=${MUSARUM_APK_MANDATORY:false}

# SWAGGER --------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.use-management-port=false
springdoc.override-with-generic-response=false
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# LOG ------------------------------------------------------------------------
# Credenciales de usuario por defecto de Spring Security: no las ponemos.
# Convivían con nuestro login JWT y solo generaban ruido (y un backdoor).
spring.jpa.open-in-view=false
logging.level.com.musarum=INFO
logging.level.org.apache.catalina=WARN
logging.level.org.apache.coyote=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.boot.StartupInfoLogger=INFO
logging.level.org.hibernate=ERROR
logging.level.org.springframework.orm.jpa=ERROR
logging.level.org.flywaydb=WARN
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.springframework.security=ERROR
logging.pattern.console=%clr(%d{HH:mm:ss}){yellow} %clr(%4p) %clr([%15.15t]){blue} %clr(%-25.25logger{0}){cyan} : %m%n

