# Perfil 'test' — valores por defecto para que el contexto arranque bajo
# Testcontainers sin depender del .env real del dueño.
#
# POSTGRES_*: Testcontainers inyecta los suyos (ver TestcontainersConfig
# con @ServiceConnection) y sobreescriben spring.datasource.*.
#
# MUSARUM_OWNER_*: el OwnerBootstrap crea el OWNER al primer arranque con
# estas credenciales. Los tests de login las usan.
MUSARUM_OWNER_NICK=owner
MUSARUM_OWNER_PASSWORD=owner123
JWT_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
JWT_EXPIRATION=3600000

# Rutas efímeras para que CoverStorage/AvatarStorage no pisen el filesystem
# del dueño. target/ se limpia entre runs.
MUSARUM_MUSIC_PATH=target/test-music
MUSARUM_COVERS_PATH=target/test-music/_covers
MUSARUM_AVATARS_PATH=target/test-music/_profilepictures
MUSARUM_VIDEOS_PATH=target/test-music/_videos

# No arrancar DevTools / scanner watcher / etc. en tests.
spring.devtools.restart.enabled=false

# Para no spamear el stdout en el test runner.
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=WARN
